name: CI

on:
  pull_request:
  push:
    branches: 
      - "**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Derive version (dev-ish)
        run: |
          SHORTSHA="$(git rev-parse --short HEAD)"
          echo "VERSION=0.0.0-dev+${SHORTSHA}" >> $GITHUB_ENV

      - name: Build + test
        run: |
          APP_VERSION="${VERSION}" cargo test --locked
          APP_VERSION="${VERSION}" cargo build --release --locked

