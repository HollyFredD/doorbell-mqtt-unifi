[package]
name = "doorbell-mqtt-unifi"
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Bridges UniFi Protect G4 Doorbell Pro devices with MQTT and Home Assistant"
repository = "https://github.com/ChrisHansenTech/doorbell-mqtt-unifi"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
md-5 = "0.10"
rumqttc = "0.24"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
signal-hook = "0.3"
ssh2 = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[profile.release]
strip = true
